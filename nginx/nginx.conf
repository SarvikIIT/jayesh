# Reverse proxy for the Hidden Hand arena (arena:8000).
# The arena is a stdlib http.server app: plain HTTP/1.0, no TLS, no compression,
# friendly 110 KB upload check of its own. This file adds what it cannot do:
# public port 80, upload ceiling above the app's own check, POST rate limits,
# gzip, and security headers.

user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 512;
}

http {
    server_tokens off;
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" rt=$request_time up=$upstream_response_time';
    access_log /var/log/nginx/access.log main;

    sendfile on;
    keepalive_timeout 65;

    gzip on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript;

    # Many teams may sit behind college NAT, so keep the general zone generous
    # and tighten only the state-changing endpoints below.
    # Behind cloudflared every request comes from the local tunnel, so without
    # this all visitors share ONE rate limit. Take the visitor's address from
    # the header Cloudflare sets. Safe only while port 80 is reachable by the
    # tunnel alone (no public port 80 on the host).
    set_real_ip_from 127.0.0.1;
    set_real_ip_from 172.16.0.0/12;
    set_real_ip_from 192.168.0.0/16;
    set_real_ip_from 10.0.0.0/8;
    real_ip_header CF-Connecting-IP;

    limit_req_zone $binary_remote_addr zone=general:10m rate=20r/s;
    limit_req_zone $binary_remote_addr zone=forms:10m rate=1r/s;

    upstream arena {
        # Mirrors PORT in docker-compose.yml. Change both together.
        server arena:8000 max_fails=3 fail_timeout=10s;
    }

    server {
        listen 80;
        server_name _;

        # Must stay above the arena's own MAX_BYTES + 10_000 (~110 KB) check,
        # so oversized uploads get the app's friendly message, not a bare 413.
        client_max_body_size 2m;
        client_body_timeout 30s;

        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;

        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options SAMEORIGIN always;
        add_header Referrer-Policy no-referrer always;

        limit_req zone=general burst=40 nodelay;

        # Registration and bot uploads: 1 upload / 10 min per team is the app
        # rule; this only stops flooding proxies, never legitimate use.
        location ~ ^/(register|login|submit|admin/login)$ {
            limit_req zone=forms burst=3 nodelay;
            proxy_pass http://arena;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location / {
            proxy_pass http://arena;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }

    # HTTPS: terminate TLS above this stack (cloudflared, a VM load balancer,
    # or certbot adding a 443 server here) rather than in the arena, which
    # speaks plain HTTP only.
}
