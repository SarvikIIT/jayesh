name: hiddenhand

# Single-host production stack: arena (stdlib HTTP on 8000) behind nginx.
# SQLite lives in the hh-data volume. Run EXACTLY ONE arena replica:
# the DB is a single-writer store, scaling to 2+ replicas corrupts/splits it.

services:
  arena:
    build: .
    image: hiddenhand-arena:latest
    container_name: hiddenhand-arena
    env_file:
      - path: .env
        required: false # all vars below have sane defaults; .env overrides them
    environment:
      PORT: "8000" # must match the nginx upstream; change both together
      ARENA_DATA: /data
      TZ: ${TZ:-UTC}
      DEADLINE: ${DEADLINE:-}
      DEALS: ${DEALS:-200}
      FINAL_DEALS: ${FINAL_DEALS:-500}
      COOLDOWN: ${COOLDOWN:-600}
      WORKERS: ${WORKERS:-3}
      # Every fight in its own container: no network, read-only, no mounts.
      # Peak use is WORKERS x MATCH_MEMORY, so size these to the VM.
      MATCH_ISOLATION: docker
      MATCH_IMAGE: hiddenhand-arena:latest
      MATCH_MEMORY: ${MATCH_MEMORY:-2g}
      MATCH_CPUS: ${MATCH_CPUS:-4}
    # Docker-outside-Docker: the arena drives the host daemon to start fight
    # containers. The socket is root on the host, so only the arena gets it;
    # bot code never runs in this container. DOCKER_GID is the socket's group
    # (scripts/deploy.sh fills it in), letting the unprivileged arena user use it.
    group_add:
      - "${DOCKER_GID:-999}"
    volumes:
      - hh-data:/data
      - /var/run/docker.sock:/var/run/docker.sock
    expose:
      - "8000" # reachable only via nginx, never published to the host
    restart: unless-stopped
    stop_grace_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  nginx:
    image: nginx:1.27-alpine
    container_name: hiddenhand-nginx
    ports:
      - "${NGINX_HTTP_PORT:-80}:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      arena:
        condition: service_healthy
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  hh-data:
